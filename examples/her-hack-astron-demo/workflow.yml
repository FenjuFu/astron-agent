flowMeta:
  name: Her Hack Astron Demo
  description: 将黑客松创意整理成结构化项目简报
  category: 10
  dslVersion: v1
flowData:
  nodes:
    - id: node-start::demo-start
      type: 开始节点
      data:
        label: 开始
        outputs:
          - id: output-user-input
            name: AGENT_USER_INPUT
            schema:
              type: string
              default: 用户输入
            required: true
            deleteDisabled: true
        nodeParam: {}
    - id: spark-llm::demo-llm
      type: 大模型
      data:
        label: 黑客松项目简报生成
        inputs:
          - id: input-user-text
            name: input
            schema:
              type: ref
              content:
                name: AGENT_USER_INPUT
                id: output-user-input
                nodeId: node-start::demo-start
        outputs:
          - id: output-brief
            name: output
            schema:
              type: string
              default: ''
        nodeParam:
          model: spark
          apiKey: YOUR_API_KEY
          apiSecret: YOUR_API_SECRET
          appId: YOUR_APP_ID
          template: |-
            请将以下黑客松创意整理成一个适合演示与立项的 Astron 项目简报：
            {{input}}
          systemTemplate: |-
            你是一名黑客松项目教练。请输出四个部分：
            1. 项目目标
            2. 用户价值
            3. 工作流设计
            4. Demo 清单
          maxTokens: 1024
          temperature: 0.4
          topK: 4
          dslVersion: v1
    - id: node-end::demo-end
      type: 结束节点
      data:
        label: 结束
        inputs:
          - id: input-final-output
            name: output
            schema:
              type: ref
              content:
                name: output
                id: output-brief
                nodeId: spark-llm::demo-llm
        nodeParam:
          template: |-
            {{output}}
          streamOutput: true
  edges:
    - id: edge-start-to-llm
      source: node-start::demo-start
      target: spark-llm::demo-llm
      type: customEdge
      data:
        edgeType: curve
    - id: edge-llm-to-end
      source: spark-llm::demo-llm
      target: node-end::demo-end
      type: customEdge
      data:
        edgeType: curve
